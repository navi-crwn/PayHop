# nginx vhost for PayHop (pay.hel.ink), same shape as note.hel.ink: Cloudflare in
# front with the *.hel.ink origin certificate, the Go binary on 127.0.0.1:8105.
#
# The Go server sends COOP/COEP/CORP and the CSP itself (internal/app/app.go), so
# they are the same behind nginx, behind `npm run local`, and in the tests. nginx
# only adds what belongs to the edge. Do not add another Content-Security-Policy
# here: two CSP headers are both enforced, and the stricter one wins silently.
#
# Install: /etc/nginx/sites-available/pay.hel.ink, symlink into sites-enabled,
# `nginx -t && systemctl reload nginx` (deploy/install.sh does this).

server {
    listen 80;
    listen [::]:80;
    server_name pay.hel.ink;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pay.hel.ink;

    ssl_certificate     /etc/ssl/certs/hel.ink-origin.crt;
    ssl_certificate_key /etc/ssl/private/hel.ink-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/pay.hel.ink.access.log;
    error_log  /var/log/nginx/pay.hel.ink.error.log;

    # Files are converted in the browser and never uploaded. The only request
    # bodies are the hub's signed events (1 MB cap in the server).
    client_max_body_size 1m;

    # The worker chunk is ~610 KB raw, ~236 KB gzip. Cloudflare compresses to the
    # visitor; this compresses the Cloudflare-to-origin hop as well.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/manifest+json;

    location / {
        proxy_pass http://127.0.0.1:8105;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Real-IP "";
        proxy_read_timeout 60s;
    }
}
